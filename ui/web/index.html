<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>FinanceAudit — Audit Evidence Viewer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">FinanceAudit</span>
    <span class="brand-sub" id="brand-sub">—</span>
  </div>
  <div class="topbar-right">
    <div class="topstats" id="topstats">
      <span class="stat" id="stat-mode" title="Data source">–</span>
      <span class="stat" id="stat-coverage" title="Parse coverage across all source files">–</span>
      <span class="stat" id="stat-balance" title="Sum of GL posting amounts">–</span>
    </div>
    <div class="lang-toggle" id="view-toggle" role="group" aria-label="View">
      <button type="button" data-view="findings" id="view-findings-btn" class="active">Findings</button>
      <button type="button" data-view="data" id="view-data-btn">Data</button>
    </div>
    <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language">
      <button type="button" data-loc="en" id="lang-en">EN</button>
      <button type="button" data-loc="de" id="lang-de">DE</button>
      <button type="button" data-loc="zh" id="lang-zh">中</button>
    </div>
  </div>
</header>

<section class="exec-strip" id="exec-strip" aria-label="Audit summary"></section>

<main class="layout">
  <nav class="pane pane-left" id="pane-findings" aria-label="Findings">
    <div id="findings-list"></div>
    <section class="pbc-block" id="pbc-block"></section>
    <footer class="pane-footer">
      <span id="llm-note">llm_used: false · deterministic pipeline</span>
    </footer>
  </nav>

  <section class="pane pane-center" id="pane-evidence" aria-label="Evidence card">
    <div id="evidence-card" class="empty-state">Select a finding …</div>
  </section>

  <aside class="pane pane-right" id="pane-source" aria-label="Source view">
    <div class="src-caption" id="src-caption">–</div>
    <div class="src-body" id="src-body">
      <div class="empty-state" id="src-hint">–</div>
    </div>
  </aside>
</main>

<main class="layout data-layout" id="data-view" hidden>
  <nav class="pane pane-left" aria-label="Tables">
    <div class="group-h" id="data-tables-h">Tables</div>
    <div id="data-tables"></div>
  </nav>
  <section class="pane pane-data" aria-label="Table data">
    <div class="data-toolbar">
      <span class="src-caption" id="data-caption">–</span>
      <input type="search" id="data-search" placeholder="Search …">
      <div class="pager">
        <button type="button" id="data-prev">Prev</button>
        <span id="data-range">–</span>
        <button type="button" id="data-next">Next</button>
      </div>
    </div>
    <div class="profile-strip" id="data-profile"></div>
    <div class="data-body" id="data-body"></div>
  </section>
</main>

<script type="module" src="app.js"></script>
<script type="module" src="data.js"></script>
<script type="module" src="ws.js"></script>
</body>
</html>
